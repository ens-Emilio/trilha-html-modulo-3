<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img"
     aria-label="Ilustração de um ninja mascarado saltando sobre o telhado da vila, com uma espiral laranja ao fundo">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#2d3f6b"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="telhado" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#ceu)"/>

  <!-- sol / espiral ao fundo -->
  <circle cx="960" cy="110" r="78" fill="url(#sol)" opacity="0.95"/>
  <path d="M960 110 m-42 0 a42 42 0 1 1 42 42 a34 34 0 1 1 -34 -34 a26 26 0 1 1 26 26 a18 18 0 1 1 -18 -18 a10 10 0 1 1 10 10"
        fill="none" stroke="#14213d" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- nuvens -->
  <g fill="#ffffff" opacity="0.12">
    <ellipse cx="220" cy="70" rx="90" ry="26"/>
    <ellipse cx="300" cy="60" rx="60" ry="20"/>
    <ellipse cx="640" cy="45" rx="70" ry="20"/>
  </g>

  <!-- montanhas / Hokage -->
  <path d="M0 250 L120 170 L210 250 Z" fill="#1b2a4a"/>
  <path d="M150 250 L290 140 L430 250 Z" fill="#233457"/>
  <path d="M380 250 L470 190 L560 250 Z" fill="#1b2a4a"/>

  <!-- vila: telhados -->
  <g>
    <rect x="60" y="250" width="1080" height="70" fill="#0f1a30"/>
    <g fill="url(#telhado)">
      <path d="M120 250 L170 218 L220 250 Z"/>
      <path d="M240 250 L292 214 L344 250 Z"/>
      <path d="M360 250 L410 220 L460 250 Z"/>
      <path d="M700 250 L752 214 L804 250 Z"/>
      <path d="M820 250 L872 220 L924 250 Z"/>
      <path d="M940 250 L992 216 L1044 250 Z"/>
    </g>
    <g fill="#fbbf24" opacity="0.75">
      <rect x="150" y="262" width="14" height="18"/>
      <rect x="276" y="262" width="14" height="18"/>
      <rect x="396" y="262" width="14" height="18"/>
      <rect x="738" y="262" width="14" height="18"/>
      <rect x="858" y="262" width="14" height="18"/>
      <rect x="978" y="262" width="14" height="18"/>
    </g>
  </g>

  <!-- ninja saltando (silhueta original) -->
  <g transform="translate(560,96)">
    <!-- pernas -->
    <path d="M22 74 L4 116 L22 120 L40 84 Z" fill="#14213d"/>
    <path d="M40 76 L58 108 L42 120 L28 88 Z" fill="#1b2a4a"/>
    <!-- tronco / jaqueta -->
    <path d="M14 26 Q40 16 62 30 L68 78 Q40 90 16 78 Z" fill="#f97316"/>
    <path d="M14 26 Q40 16 62 30 L64 44 Q40 54 14 42 Z" fill="#c2410c"/>
    <!-- faixa / cinto -->
    <rect x="14" y="72" width="54" height="10" rx="4" fill="#14213d"/>
    <!-- braços -->
    <path d="M16 34 L-14 54 L-8 66 L18 50 Z" fill="#f97316"/>
    <path d="M62 36 L88 20 L94 32 L66 52 Z" fill="#f97316"/>
    <!-- cabeça + bandana -->
    <circle cx="40" cy="8" r="18" fill="#f4c89a"/>
    <path d="M22 4 Q40 -14 58 4 L58 12 Q40 2 22 12 Z" fill="#14213d"/>
    <rect x="22" y="6" width="36" height="12" rx="3" fill="#2d3f6b"/>
    <!-- placa da bandana -->
    <rect x="32" y="7" width="16" height="10" rx="2" fill="#cbd5e1"/>
    <path d="M36 12 h8 M40 9 v6" stroke="#14213d" stroke-width="1.6"/>
    <!-- espiral na placa -->
    <path d="M40 12 m-3 0 a3 3 0 1 1 3 3" fill="none" stroke="#c2410c" stroke-width="1.4"/>
    <!-- cachecol -->
    <path d="M26 26 Q8 34 0 52 Q10 50 16 42 Q22 36 30 34 Z" fill="#cbd5e1"/>
  </g>

  <!-- kunai -->
  <g transform="translate(880,200) rotate(20)">
    <path d="M0 0 L10 26 L0 40 L-10 26 Z" fill="#cbd5e1"/>
    <rect x="-3" y="40" width="6" height="22" fill="#7c2d12"/>
    <circle cx="0" cy="66" r="6" fill="none" stroke="#7c2d12" stroke-width="4"/>
  </g>

  <!-- texto -->
  <text x="70" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="bold" fill="#ffffff">Naruto Clássico</text>
  <text x="72" y="188" font-family="Verdana, Geneva, sans-serif" font-size="18" fill="#fbbf24">A jornada do ninja que nunca desiste</text>
</svg>
