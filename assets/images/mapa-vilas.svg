<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img"
     aria-label="Mapa esquemático com cinco grandes nações ninja e suas respectivas vilas ocultas">
  <rect width="600" height="380" fill="#eef6ff"/>

  <!-- massas de terra estilizadas -->
  <path d="M60 60 Q160 20 260 70 Q340 110 300 190 Q250 260 150 250 Q60 240 50 160 Z" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <path d="M330 90 Q430 60 520 110 Q570 150 540 230 Q490 300 390 280 Q320 260 320 180 Z" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>

  <!-- rio -->
  <path d="M0 300 Q120 270 220 300 Q330 335 440 300 Q530 270 600 295" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- vila 1 -->
  <g transform="translate(150,140)">
    <circle r="34" fill="#c2410c" opacity="0.16"/>
    <path d="M-16 8 L0 -18 L16 8 Z" fill="#c2410c"/>
    <rect x="-13" y="8" width="26" height="16" fill="#7c2d12"/>
    <path d="M0 24 m-9 0 a9 9 0 1 1 9 9 a6 6 0 1 1 -6 -6" fill="none" stroke="#c2410c" stroke-width="3"/>
    <text y="58" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" font-weight="bold" fill="#14213d">Vila da Folha</text>
  </g>

  <!-- vila 2 -->
  <g transform="translate(430,140)">
    <circle r="34" fill="#0ea5e9" opacity="0.16"/>
    <path d="M-16 8 L0 -18 L16 8 Z" fill="#0369a1"/>
    <rect x="-13" y="8" width="26" height="16" fill="#075985"/>
    <text y="58" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" font-weight="bold" fill="#14213d">Vila da Névoa</text>
  </g>

  <!-- vila 3 -->
  <g transform="translate(120,250)">
    <circle r="30" fill="#a16207" opacity="0.16"/>
    <path d="M-14 7 L0 -16 L14 7 Z" fill="#a16207"/>
    <rect x="-11" y="7" width="22" height="14" fill="#713f12"/>
    <text y="52" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" font-weight="bold" fill="#14213d">Vila da Areia</text>
  </g>

  <!-- vila 4 -->
  <g transform="translate(470,250)">
    <circle r="30" fill="#7c3aed" opacity="0.16"/>
    <path d="M-14 7 L0 -16 L14 7 Z" fill="#6d28d9"/>
    <rect x="-11" y="7" width="22" height="14" fill="#4c1d95"/>
    <text y="52" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" font-weight="bold" fill="#14213d">Vila da Nuvem</text>
  </g>

  <!-- vila 5 -->
  <g transform="translate(300,325)">
    <circle r="28" fill="#0f766e" opacity="0.16"/>
    <path d="M-13 6 L0 -15 L13 6 Z" fill="#0f766e"/>
    <rect x="-10" y="6" width="20" height="13" fill="#134e4a"/>
    <text y="50" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" font-weight="bold" fill="#14213d">Vila da Pedra</text>
  </g>

  <!-- rosa dos ventos -->
  <g transform="translate(555,45)" fill="#64748b">
    <circle r="22" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M0 -18 L5 0 L0 18 L-5 0 Z"/>
    <path d="M-18 0 L0 -5 L18 0 L0 5 Z" opacity="0.5"/>
  </g>
</svg>
